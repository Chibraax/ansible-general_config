---

- name: Config .zshrc file
  ansible.builtin.blockinfile:
    path: /home/{{ username }}/.zshrc
    append_newline: true
    prepend_newline: true
    block: |
      alias q="exit"
      alias cat="batcat "
      alias ccat="/usr/bin/cat"
      alias df="duf --only local"
      alias cls="clear"
      alias py="/usr/bin/python3"
      alias envv="source/home/{{ username }}/.envv/bin/activate"
      alias ls="/usr/bin/lsd"
  tags:
    - gen_config

- name: Config .zshrc file
  ansible.builtin.blockinfile:
    path: /root/.zshrc
    append_newline: true
    prepend_newline: true
    block: |
      alias q="exit"
      alias cat="batcat "
      alias ccat="/usr/bin/cat"
      alias df="duf --only local"
      alias cls="clear"
      alias py="/usr/bin/python3"
      alias envv="source/home/{{ username }}/.envv/bin/activate"
      alias ls="/usr/bin/lsd"
  tags:
    - gen_config


- name: Set the hostname
  ansible.builtin.lineinfile:
    path: /etc/hostname
    regexp: '^.+'
    line: "{{ server_hostname }}"
  become: true
  notify: reboot
  tags:
    - gen_config

- name: Listen ssh Daemon on port 5656
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#Port 22'
    line: 'Port  {{ port_ssh }}'
  tags: gen_config

- name: Copy vimrc file for root
  ansible.builtin.copy:
    src: files/vimrc
    dest: /root/.vimrc
    owner: root
    group: root
    mode: '0744'
  tags: gen_config

- name: Copy vimrc file for user
  ansible.builtin.copy:
    src: files/vimrc
    dest: "/home/{{ ansible_user }}/.vimrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0744'
  tags: gen_config
