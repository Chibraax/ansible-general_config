---
- name: Add aliases inside .zshrc file For {{ username }}
  ansible.builtin.lineinfile:
    path: /home/{{ username }}/.zshrc
    line: "{{ item }}"
  loop: "{{ alias_config }}"
  tags:
    - gen_config

- name: Add aliases inside .zshrc file for ROOT user
  ansible.builtin.lineinfile:
    path: /root/.zshrc
    line: "{{ item }}"
  loop: "{{ alias_config }}"
  tags:
    - gen_config

- name: Set the hostname
  ansible.builtin.lineinfile:
    path: /etc/hostname
    regexp: '^.+'
    line: "{{ server_hostname }}"
  become: true
  notify: reboot
  tags:
    - gen_config

- name: Listen ssh Daemon on port 5656
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#Port 22'
    line: 'Port 5656'
  tags: gen_config

- name: Copy vimrc file for root
  ansible.builtin.copy:
    src: files/vimrc
    dest: /root/.vimrc
    owner: root
    group: root
    mode: '0744'
  tags: gen_config

- name: Copy vimrc file for user
  ansible.builtin.copy:
    src: files/vimrc
    dest: "/home/{{ ansible_user }}/.vimrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0744'
  tags: gen_config
